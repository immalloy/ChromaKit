name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxext-dev \
            libxft-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxrender-dev \
            libxdamage-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libgtk-3-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols

      - name: Configure Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: cmake -S . -B build

      - name: Configure Unix
        if: matrix.platform != 'windows'
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Build Unix
        if: matrix.platform != 'windows'
        shell: bash
        run: cmake --build build --parallel

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/chromakit.exe package/chromakit.exe
          Copy-Item README.md package/README.md
          Copy-Item CHANGELOG.md package/CHANGELOG.md
          cmake -E tar cfv chromakit-windows.zip --format=zip package

      - name: Package Unix
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          rm -rf package
          mkdir package
          cp build/chromakit package/chromakit
          cp README.md package/README.md
          cp CHANGELOG.md package/CHANGELOG.md
          cmake -E tar cfv chromakit-${{ matrix.platform }}.zip --format=zip package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: chromakit-${{ matrix.platform }}
          path: chromakit-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: chromakit-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes
        shell: bash
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 == "## " tag { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.zip --repo "$GITHUB_REPOSITORY" --title "Chromakit $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
