name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    name: Python checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall src

      - name: Verify project metadata
        run: python -m pip install --no-deps -e .

      - name: Verify module entry point
        run: python -c "import chromakit; import chromakit.__main__"
        env:
          PYTHONPATH: src

      - name: Build app
        run: python scripts/build.py
