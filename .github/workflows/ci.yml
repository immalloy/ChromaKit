name: Build

on:
  push:
    branches:
      - main
      - legacy
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxext-dev \
            libxft-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxrender-dev \
            libxdamage-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libgtk-3-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols

      - name: Configure Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: cmake -S . -B build

      - name: Configure Unix
        if: matrix.platform != 'windows'
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: cmake --build build --target chromakit --config Release --parallel

      - name: Build Unix
        if: matrix.platform != 'windows'
        shell: bash
        run: cmake --build build --target chromakit --parallel
