name: Snapshot Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build latest dev release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build ChromaKit
        run: python scripts/build.py

      - name: Upload build asset
        uses: actions/upload-artifact@v5
        with:
          name: chromakit-${{ runner.os }}
          path: dist/release/*

  release:
    name: Update latest dev release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build assets
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Move snapshot tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f snapshot "$GITHUB_SHA"
          git push -f origin snapshot

      - name: Create or update snapshot release
        run: |
          cat > release-notes.md <<'NOTES'
          Automatically updated from the latest commit on main.

          Downloads:
          - ChromaKit-windows.zip for Windows
          - ChromaKit-macos.zip for macOS
          - ChromaKit-linux.zip for Linux
          NOTES

          if ! gh release view snapshot >/dev/null 2>&1; then
            gh release create snapshot \
              --title "Latest Dev Build" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release edit snapshot \
              --title "Latest Dev Build" \
              --notes-file release-notes.md \
              --prerelease
          fi

          find release-assets -type f -print0 | while IFS= read -r -d '' asset; do
            gh release upload snapshot "$asset" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
