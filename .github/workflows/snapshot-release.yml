name: Snapshot Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build latest dev release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build ChromaKit
        run: .\build.bat

      - name: Move snapshot tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f snapshot $env:GITHUB_SHA
          git push -f origin snapshot

      - name: Create or update snapshot release
        run: |
          gh release view snapshot *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create snapshot `
              --title "Latest Dev Build" `
              --notes "Automatically updated from the latest commit on main." `
              --prerelease `
              dist\ChromaKit.exe
          } else {
            gh release edit snapshot `
              --title "Latest Dev Build" `
              --notes "Automatically updated from the latest commit on main." `
              --prerelease
            gh release upload snapshot dist\ChromaKit.exe --clobber
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
