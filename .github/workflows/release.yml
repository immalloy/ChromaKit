name: Package Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package (for example, v1.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Windows x64 application
        shell: pwsh
        run: |
          $clang = Get-Command clang.exe -ErrorAction Stop
          $env:LIBCLANG_PATH = Split-Path $clang.Source
          cargo build --locked --release --bin chromakit

      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target/release/chromakit.exe package/chromakit.exe
          Copy-Item README.md package/README.md
          Copy-Item CHANGELOG.md package/CHANGELOG.md
          Compress-Archive -Path package/* -DestinationPath chromakit-windows-x64.zip -Force

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromakit-windows-x64-${{ inputs.tag }}
          path: chromakit-windows-x64.zip
          if-no-files-found: error
